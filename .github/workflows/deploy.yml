name: Deploy to Raspberry Pi

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests"; fi

      - name: Set up Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Add SSH key
        run: |
          set -euxo pipefail
          install -m 700 -d ~/.ssh
          echo "PI_HOST=${{ secrets.PI_HOST }}"
          echo "PI_HOST_has_slash=$([[ "${{ secrets.PI_HOST }}" == *"/"* ]] && echo yes || echo no)"
          echo "PI_HOST_has_colon=$([[ "${{ secrets.PI_HOST }}" == *":"* ]] && echo yes || echo no)"
          echo "PI_HOST_len=$(printf '%s' "${{ secrets.PI_HOST }}" | wc -c)"
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ls -la ~/.ssh
          ssh-keyscan -H "${{ secrets.PI_HOST }}" >> ~/.ssh/known_hosts || true
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -v "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" "echo ssh-ok" || true

      - name: Deploy via rsync
        run: |
          rsync -az --delete --exclude '.venv' --exclude '.git' ./ "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}:${{ secrets.PI_PATH }}"

      - name: Restart service
        run: |
          ssh "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" "\
            sudo cp /home/ray/hailo-infer/systemd/hailo-infer-healthcheck.service /etc/systemd/system/ && \
            sudo cp /home/ray/hailo-infer/systemd/hailo-infer-healthcheck.timer /etc/systemd/system/ && \
            sudo systemctl daemon-reload && \
            sudo systemctl enable --now hailo-infer-healthcheck.timer && \
            sudo systemctl restart hailo-infer"
