name: Deploy to Raspberry Pi

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests"; fi

      - name: Check coach commentary rules
        run: |
          PYTHONPYCACHEPREFIX=/tmp/hailo_pycache python -m py_compile app/services/coach_commentary.py scripts/check_coach_commentary.py scripts/preview_coach_findings.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_coach_commentary.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/preview_coach_findings.py low_tracking_late_release --json >/tmp/coach_findings_preview.json

      - name: Check event evidence regression
        run: |
          PYTHONPYCACHEPREFIX=/tmp/hailo_pycache python -m py_compile app/services/coach_pipeline.py scripts/check_body_event_selector.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_body_event_selector.py

      - name: Check club preprocessing lab
        run: |
          PYTHONPYCACHEPREFIX=/tmp/hailo_pycache python -m py_compile app/services/club_preprocess_lab.py scripts/club_preprocess_lab.py scripts/check_club_preprocess_lab.py scripts/check_club_preprocess_lab_service.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_club_preprocess_lab.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_club_preprocess_lab_service.py

      - name: Set up Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Add SSH key
        run: |
          set -euxo pipefail
          install -m 700 -d ~/.ssh
          echo "PI_HOST=${{ secrets.PI_HOST }}"
          echo "PI_HOST_has_slash=$([[ "${{ secrets.PI_HOST }}" == *"/"* ]] && echo yes || echo no)"
          echo "PI_HOST_has_colon=$([[ "${{ secrets.PI_HOST }}" == *":"* ]] && echo yes || echo no)"
          echo "PI_HOST_len=$(printf '%s' "${{ secrets.PI_HOST }}" | wc -c)"
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ls -la ~/.ssh
          # Tailscale can take a few seconds to establish a route on a fresh
          # GitHub runner. Do not ignore a missing host key: retry discovery,
          # then make both the SSH probe and rsync verify it strictly.
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -H "${{ secrets.PI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
            test -s ~/.ssh/known_hosts && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" "echo ssh-ok"

      - name: Deploy via rsync
        run: |
          rsync -az --delete --exclude '.venv' --exclude '.git' ./ "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}:${{ secrets.PI_PATH }}"

      - name: Restart service
        run: |
          ssh "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" "\
            cd /home/ray/hailo-infer && \
            python3 -m venv .venv && \
            .venv/bin/python -m pip install --upgrade pip && \
            .venv/bin/python -m pip install -r requirements.txt && \
            sudo cp /home/ray/hailo-infer/systemd/hailo-infer-healthcheck.service /etc/systemd/system/ && \
            sudo cp /home/ray/hailo-infer/systemd/hailo-infer-healthcheck.timer /etc/systemd/system/ && \
            sudo systemctl daemon-reload && \
            sudo systemctl enable --now hailo-infer-healthcheck.timer && \
            sudo systemctl restart hailo-infer"
