name: Deploy to Raspberry Pi

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests"; fi

      - name: Add SSH key
        run: |
          set -euxo pipefail
          install -m 700 -d ~/.ssh
          echo "PI_HOST=100.124.151.57"
          echo "PI_HOST_has_slash=$([[ "100.124.151.57" == *"/"* ]] && echo yes || echo no)"
          echo "PI_HOST_has_colon=$([[ "100.124.151.57" == *":"* ]] && echo yes || echo no)"
          echo "PI_HOST_len=$(printf '%s' "100.124.151.57" | wc -c)"
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ls -la ~/.ssh
          ssh-keyscan -H -v "100.124.151.57" >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -v "${{ secrets.PI_USER }}@100.124.151.57" "echo ssh-ok" || true

      - name: Deploy via rsync
        run: |
          rsync -az --delete --exclude '.venv' --exclude '.git' ./ "${{ secrets.PI_USER }}@100.124.151.57:${{ secrets.PI_PATH }}"

      - name: Restart service
        run: |
          ssh "${{ secrets.PI_USER }}@100.124.151.57" "sudo systemctl restart hailo-infer"
